# Reference fragment for /etc/falco/falco.yaml
# install/setup-falco-guard.sh apply this changes
# automatically over falco.yaml already installed
# only for reference.

json_output: true
json_include_output_property: true

# Needed: without this only the first rule will be apply
rule_matching: all

http_output:
  enabled: true
  # Where UPDATE_TOKEN_16C you type for the value of GUARD_TOKEN
  # defined in /etc/falco-guard/env. The token will only be safe in there 
  # because the service only listens in 127.0.0.1.
  url: "http://127.0.0.1:8080/falco?token=REEMPLAZAR_CON_TU_TOKEN"

# Confirm that the route appears in rules_files, along with the default rules of FALCO
#
# rules_files:
#   - /etc/falco/falco_rules.yaml
#   - /etc/falco/falco_rules.local.yaml
#   - /etc/falco/rules.d
